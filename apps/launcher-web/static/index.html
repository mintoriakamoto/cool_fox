<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory Launcher - Sessions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { color: #667eea; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; }
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .session-card {
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .game-name { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .metric:last-child { border-bottom: none; }
        .metric-label { color: #666; }
        .metric-value { font-weight: bold; color: #667eea; }
        .error {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 10px;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Victory Launcher</h1>
            <p class="subtitle">Game Performance Profiling Sessions</p>
        </header>

        <div id="content"></div>
    </div>

    <script>
        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions');
                const data = await response.json();

                const content = document.getElementById('content');

                if (!data.sessions || data.sessions.length === 0) {
                    content.innerHTML = '<div class="error">No profiling sessions found. Run: <code>cargo run -p profile-demo --release</code></div>';
                    return;
                }

                const html = data.sessions.map((session, idx) => `
                    <a href="/dashboard.html?id=${session.id}" class="session-card">
                        <div class="game-name">${session.name}</div>
                        <div class="metric">
                            <span class="metric-label">FPS</span>
                            <span class="metric-value">${session.fps_avg.toFixed(1)} avg</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">GPU Load</span>
                            <span class="metric-value">${session.gpu_load.toFixed(0)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">GPU Temp</span>
                            <span class="metric-value">${Math.round(session.gpu_temp)}°C</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">CPU Load</span>
                            <span class="metric-value">${session.cpu_load.toFixed(0)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Duration</span>
                            <span class="metric-value">${session.duration.toFixed(1)}s</span>
                        </div>
                    </a>
                `).join('');

                const grid = document.createElement('div');
                grid.className = 'sessions-grid';
                grid.innerHTML = html;
                content.appendChild(grid);
            } catch (err) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        Error loading sessions: ${err.message}<br><br>
                        Make sure the web server is running:<br>
                        <code>./target/release/launcher-web</code>
                    </div>
                `;
            }
        }

        loadSessions();
    </script>
</body>
</html>
